<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <div class="background"></div>

    <div class="top-buttons right">
        <button title="Theme"></button>
        <button title="Menu"></button>
    </div>

    <div class="top-buttons left">
        <button title="Home"></button>
    </div>

    <div class="center">
        <div class="logo">
            <p>LOGO</p>
        </div>
        <div class="buttons">
            <div>see my work</div>
            <div>get in touch</div>
        </div>
    </div>

    <div class="marquee3k roles" data-speed="0.3" data-pausable="true">
        <span>
            <span>UX Design</span>
            <span>Frontend Development</span>
            <span>Web Design</span>
        </span>
    </div>

    <!-- Librería Marquee3000 -->
    <script src="https://cdn.jsdelivr.net/npm/marquee3000@1.0.4/marquee3k.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>Marquee3k.init();</script>

</body>
</html>
