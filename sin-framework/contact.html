<!DOCTYPE html>
<html lang="es-CO">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/menuStyle.css">
    <link rel="stylesheet" href="css/contactStyle.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
</head>

<body>
    <header>
        <div id="logo">
            <p>LOGO</p>
        </div>
        <div id="icono-menu">
            <span class="circle-left-top"></span>
            <span class="circle-right-top"></span>
            <span class="circle-left-bottom"></span>
            <span class="circle-right-bottom"></span>
        </div>
    </header>
    <div class="container">
        <div class="container-body">
            <div id="header-contact">
                <div class="header-text">Contactáme</div>
                <div class="header-divide"></div>
            </div>
            <div class="body-contact">
                <form id="formularioContacto" onsubmit="return validarFormulario()">
                    <div class="form-item">
                        <label for="id-contacto" class="form-label">Identificación</label>
                        <input type="text" id="id-contacto" name="id-contacto" class="form-control" placeholder="...">
                        <label class="text-danger form-text" id="errorIdContacto"></label><br>
                    </div>    
                    
                    <div class="form-item">
                        <label for="nombres" class="form-label">Nombres</label>
                        <input type="text" id="nombres" name="nombres" class="form-control" placeholder="...">
                        <label class="text-danger form-text" id="errorNombres"></label><br>
                    </div>    
                    
                    <div class="form-item">
                        <label for="apellidos" class="form-label">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" class="form-control" placeholder="..." >
                        <label class="text-danger form-text" id="errorApellidos"></label><br>
                    </div>    
                    
                    <div class="form-item">
                        <label for="correo-electronico" class="form-label">Correo Electrónico</label>
                        <input type="email" id="correo-electronico" name="correo-electronico" class="form-control" placeholder="correo@ejemplo.com" >
                        <label class="text-danger form-text" id="errorCorreo"></label><br>
                    </div>    
                    
                    <div class="form-item">
                        <label for="telefono" class="form-label">Telefono</label>
                        <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="...">
                        <label class="text-danger form-text" id="errorTelefono"></label><br>
                    </div>

                    <div class="form-select">
                        <label for="motivo-contacto" class="form-label">Motivo de contacto</label>
                        <select id="motivo-contacto" name="motivo-contacto" required>
                            <option value="">-- Selecciona un motivo --</option>
                            <option value="soporte">Soporte técnico</option>
                            <option value="consulta">Consulta general</option>
                            <option value="sugerencia">Sugerencia</option>
                        </select>
                        <label class="text-danger form-text" id="errorMotivoContacto"></label><br>
                    </div>
                    
                    <div class="form-textarea">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" placeholder="..." rows="4"></textarea>
                        <label class="text-danger form-text" id="errorMensaje"></label><br>
                    </div> 

                    <div class="form-checkbox">
                        <input type="checkbox" id="acepta-terminos" name="acepta-terminos">
                        <label for="acepta-terminos">Acepto los términos y condiciones</label>
                        <label class="text-danger form-text" id="errorAceptaTerminos"></label><br>
                    </div>

                    <fieldset class="form-radio">
                        <legend class="form-label">Preferencia de contacto</legend>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="email" name="preferencia-contacto" value="email" >
                            <label class="form-check-label" for="email">Email</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="celular" name="preferencia-contacto" value="celular">
                            <label class="form-check-label" for="celular">Teléfono</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="whatsApp" name="preferencia-contacto" value="whatsApp">
                            <label class="form-check-label" for="whatsApp">WhatsApp</label>
                        </div>
                        <label class="text-danger form-text" id="errorPreferenciaContacto"></label><br>
                    </fieldset>
                    <div class="boton-container">
                        <button type="submit" id="btnRegistrar" class="btn-registrar">Registrar</button>
                    </div>

                </form>

                <div class="send-contact">
                    <p>boton</p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
