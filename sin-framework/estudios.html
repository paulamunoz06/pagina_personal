<!DOCTYPE html>
<html lang="es-CO">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio | Estudios</title>
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/cursor.css">
    <link rel="stylesheet" href="css/estudios.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <div class="background"></div>

        <div class="tooltip image">

    </div>
    <header>
        <div id="logo">
            <p><a href="index.html">JP</a></p>
        </div>
        <div id="icono-menu">

            <span class="circle-right-top"></span>
            <span class="circle-left-bottom"></span>
            <span class="circle-right-bottom"></span>
        </div>
    </header>
    <nav id="menu" class="container-menu">
        <div class="container-opciones">
            <div class="container-opcion">
                <a class="opcion" href="index.html">
                    <span class="opcion-text">Inicio</span>
                </a>
            </div>
            <div class="container-opcion">
                <a class="opcion" href="estudios.html">
                    <span class="opcion-text">Estudios</span>

            <div class="container-opcion">

                    <span class="opcion-text">Contacto</span>
                </a>

            </div>
        </div>
        <div class="footer-menu">
            <span class="text-small nav-details visible">Desarrollado por Diego Pérez &amp; Paula Muñoz</span>
            <span class="text-small nav-details visible">
                ©
                2025
            </span>
        </div>
    </nav>
    <div id="estudios" class="container-estudios">
        <div class="content-estudios">
            <div class="tabla-diego">
                <div class="header-estudios">
                    <div class="header-estudios-container-text">
                        <div class="header-estudios-text">Estudios</div>
                        <div class="header-estudios-text">Diego Pérez</div>
                    </div>
                    <div class="header-divider"></div>
                </div>
                <table class="tabla-estudios">
                    <thead>
                        <tr>
                            <th>Nivel</th>
                            <th>Institución</th>
                            <th>Años</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Universidad</td>
                            <td>Universidad del Cauca</td>
                            <td>2021-2025</td>
                        </tr>
                        
                    </tbody>
                </table>
            </div>
            <div class="tabla-paula">
                <div class="header-estudios">
                    <div class="header-estudios-container-text">
